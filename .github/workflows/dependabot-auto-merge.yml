name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates, so they squash-merge by themselves once the required CI checks pass (the required checks are set by the main ruleset in the gitlab management/repository project). A major update is left for a person to review: it is where a breaking change comes in.
#
# A merge made with GITHUB_TOKEN does not start new workflow runs, so CI and Security do not run again on main after one of these merges. Security still runs on its daily schedule.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
