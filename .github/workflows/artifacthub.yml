name: Artifact Hub metadata

# Publishes artifacthub-repo.yml next to the Helm chart in the GitHub Container
# Registry, as the tag `artifacthub.io` with the media types Artifact Hub looks
# for. Artifact Hub reads it on its next scan and lists the chart as coming
# from a verified publisher.
#
# Separate from the release workflow because the metadata describes the
# repository, not a chart version: it changes rarely, and a change should not
# wait for the next release. The tag is not SemVer, so Helm ignores it.
on:
  push:
    branches: [main]
    paths:
      - artifacthub-repo.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts/argocd-generator

jobs:
  push-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push artifacthub-repo.yml
        run: |
          oras push "${CHART_REPOSITORY}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
