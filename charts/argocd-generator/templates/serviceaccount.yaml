{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argocd-generator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-generator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The plugin only talks to the ArtefactFlow API and answers the controller; it
# needs no Kubernetes API access of its own.
automountServiceAccountToken: false
{{- end }}
