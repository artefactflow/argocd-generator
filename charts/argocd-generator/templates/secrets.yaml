{{- include "argocd-generator.validate" . -}}
{{- if not .Values.artefactflow.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argocd-generator.upstreamSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.artefactflow.clientSecret | quote }}
{{- end }}
{{- if not .Values.plugin.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argocd-generator.pluginSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-generator.labels" . | nindent 4 }}
    # Argo CD only reads secrets carrying this label.
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  token: {{ .Values.plugin.token | quote }}
{{- end }}
