{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "argocd-generator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-generator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "argocd-generator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controllerSelector | nindent 14 }}
          {{- if .Values.networkPolicy.controllerNamespaceSelector }}
          namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controllerNamespaceSelector | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.plugin.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The ArtefactFlow API (HTTPS).
    -
      {{- with .Values.networkPolicy.apiEgressCIDRs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
